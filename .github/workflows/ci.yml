name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the managed-only performance workbench (Sherland.Imaging.Pgf.Performance)
        type: boolean
        default: false
      run_benchmark:
        description: Run the native-vs-managed BenchmarkDotNet suite (Sherland.Imaging.Pgf.Benchmarks)
        type: boolean
        default: false
      run_windows_build:
        description: Also run build-and-test on windows-latest (verifies the MSVC/native path)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    # The native oracle (native/Sherland.Imaging.Pgf.Native) cross-compiles cleanly on Linux -
    # PGFplatform.h's Windows-only branch is gated behind WIN32/WINCE/__MINGW32__, which the
    # CMakeLists.txt only defines under `if(WIN32)`. ubuntu-latest ships gcc/g++/make/cmake, so no
    # extra toolchain setup is needed. Sherland.Imaging.Pgf.Performance is deliberately NOT built
    # here - it pulls in Microsoft.VisualStudio.DiagnosticsHub.BenchmarkDotNetDiagnosers for its
    # [CPUUsageDiagnoser] benchmarks (ETW-based, Windows-only), so it gets its own windows-latest job.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-and-test

  windows-build-and-test:
    # Optional twin of build-and-test verifying the MSVC/native path AGENTS.md documents (Visual
    # Studio Developer Command Prompt + CMake+Ninja) - not run on every push/PR since it roughly
    # doubles pipeline time for a platform combination that's already covered locally by whoever's
    # developing on Windows.
    if: ${{ inputs.run_windows_build }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-and-test

  performance:
    needs: build-and-test
    if: ${{ inputs.run_performance }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run performance workbench
        run: dotnet run -c Release --project source/Sherland.Imaging.Pgf.Performance

  benchmark:
    needs: build-and-test
    if: ${{ inputs.run_benchmark }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure native oracle (CMake)
        run: cmake -S native/Sherland.Imaging.Pgf.Native -B native/Sherland.Imaging.Pgf.Native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build native oracle
        run: cmake --build native/Sherland.Imaging.Pgf.Native/build --config Release

      - name: Run benchmarks (short job)
        run: dotnet run -c Release --project source/Sherland.Imaging.Pgf.Benchmarks -- --job short --filter "*" --artifacts ${{ runner.temp }}/benchmark-artifacts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-artifacts

  pack:
    # Always packs (and pushes) after a successful build-and-test - versioning is automatic via
    # MinVer (git tag/height derived SemVer), not the old manual pack_nuget/PACKAGE_VERSION toggle.
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve MinVer pre-release override
        id: minver
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ "$BRANCH" = "main" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            # SemVer pre-release identifiers only allow [0-9A-Za-z-], so sanitize
            # branch names like "docs/foo" or "feature/bar" before using them here.
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^0-9A-Za-z-]/-/g')
            echo "args=-p:MinVerVersionOverride=0.0.0-alpha-$SAFE_BRANCH.$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet package
        run: dotnet pack source/Sherland.Imaging.Pgf/Sherland.Imaging.Pgf.csproj -c Release -o ${{ runner.temp }}/nupkg ${{ steps.minver.outputs.args }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/nupkg/*.*nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "${{ runner.temp }}/nupkg/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/sherland/index.json --skip-duplicate
